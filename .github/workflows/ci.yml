name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Comprobaciones
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Ejecutar tests
        run: npm test -- --ci

      - name: Lint
        run: npm run lint
